
name: Publish Victoria Market Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "market-data.json"
      - ".github/workflows/static.yml"

  workflow_dispatch:

  workflow_run:
    workflows: ["Update Victoria Market Statistics"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - name: Download latest dashboard
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check whether publishing is needed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "https://dayteam.github.io/victoria-market-dashboard/market-data.json?check=$(date +%s)" \
            -o /tmp/published-market-data.json \
            && cmp -s market-data.json /tmp/published-market-data.json; then
            echo "Statistics already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dashboard publishing required."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.check.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare dashboard files
        if: steps.check.outputs.publish == 'true'
        run: |
          mkdir -p public
          cp index.html public/
          cp market-data.json public/
          test -s public/index.html
          test -s public/market-data.json
          python3 -m json.tool public/market-data.json > /dev/null

      - name: Upload dashboard
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
