
name: Publish Victoria Market Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "market-data.json"
      - ".github/workflows/static.yml"

  workflow_dispatch:

  workflow_run:
    workflows: ["Update Victoria Market Statistics"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download latest dashboard
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare dashboard files
        run: |
          mkdir -p public
          cp index.html public/
          cp market-data.json public/
          test -s public/index.html
          test -s public/market-data.json
          python3 -m json.tool public/market-data.json > /dev/null

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
