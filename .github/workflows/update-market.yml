
name: Update Victoria Market Statistics

on:
  workflow_dispatch:

  schedule:
    - cron: "30 17 * * *"

permissions:
  contents: write

concurrency:
  group: victoria-market-update
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check VREB statistics
        run: python scripts/update_market.py

      - name: Save verified market data
        run: |
          if git diff --quiet -- market-data.json; then
            echo "No verified changes to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add market-data.json
            git commit -m "Update verified VREB market statistics"
            git push
          fi
