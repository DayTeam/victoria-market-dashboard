
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Victoria Real Estate Market | Day Team Realty</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: #ffffff;
  color: #292929;
}

.dashboard {
  max-width: 1000px;
  margin: auto;
}

.header {
  background: #171717;
  color: #ffffff;
  border-top: 6px solid #c8102e;
  border-radius: 8px;
  padding: 28px 22px;
  text-align: center;
}

.header h1 {
  font-size: 27px;
  line-height: 1.3;
  margin: 0 0 12px;
  color: #ffffff;
}

.header p {
  margin: 0;
  font-size: 16px;
  color: #eeeeee;
}

.status {
  text-align: center;
  padding: 20px 10px;
  font-size: 15px;
  color: #666666;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin: 20px 0;
}

.stat {
  background: #f7f7f7;
  border-left: 5px solid #c8102e;
  border-radius: 5px;
  padding: 22px 18px;
}

.stat-label {
  font-size: 15px;
  font-weight: bold;
  color: #444444;
}

.stat-value {
  font-size: 30px;
  font-weight: bold;
  color: #171717;
  margin: 12px 0;
}

.stat-change {
  font-size: 14px;
  color: #666666;
}

.notice {
  background: #f7f7f7;
  border-left: 5px solid #c8102e;
  padding: 20px;
  border-radius: 5px;
  font-size: 16px;
  line-height: 1.7;
  margin: 20px 0;
}

.footer {
  text-align: center;
  padding: 22px 10px;
  font-size: 14px;
  line-height: 1.7;
  color: #666666;
}

.footer a {
  color: #c8102e;
  font-weight: bold;
}

@media (max-width: 500px) {
  body {
    padding: 10px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 23px;
  }

  .stat-value {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="dashboard">

  <div class="header">
    <h1>Greater Victoria Real Estate Market</h1>
    <p>Presented by Darren Day | Day Team Realty</p>
  </div>

  <div class="status" id="reporting-period">
    Checking latest market statistics...
  </div>

  <div id="market-content" aria-live="polite">
    <div class="notice">
      Loading market statistics...
    </div>
  </div>

  <div class="footer">
    <p>
      Source:
      <a href="https://www.vreb.org/current-statistics"
         target="_blank" rel="noopener noreferrer">
        Victoria Real Estate Board
      </a>
    </p>

    <p>
      Darren Day | Day Team Realty<br>
      Serving Greater Victoria Since 1992
    </p>
  </div>

</div>

<script>
const labels = [
  ["total_sales", "Properties Sold", ""],
  ["active_listings", "Active MLS Listings", ""],
  ["victoria_core_detached_benchmark",
   "Victoria Core Detached Home", "$"],
  ["victoria_core_condo_benchmark",
   "Victoria Core Condominium", "$"]
];

function formatNumber(value, prefix) {
  if (typeof value !== "number" ||
      !Number.isFinite(value)) {
    return "—";
  }

  return prefix +
    value.toLocaleString("en-CA", {
      maximumFractionDigits: 0
    });
}

function makeElement(tag, className, content) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = content;
  return element;
}

function showNotice(message) {
  const container =
    document.getElementById("market-content");

  container.replaceChildren(
    makeElement("div", "notice", message)
  );
}

async function loadMarketData() {
  try {
    const response = await fetch(
      "./market-data.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Data file unavailable");
    }

    const data = await response.json();

    const period =
      document.getElementById("reporting-period");

    const stats = data.statistics;

    const validPeriod =
      typeof data.reporting_month === "string" &&
      Number.isInteger(data.reporting_year);

    const validStats =
      stats &&
      labels.every(([key]) =>
        typeof stats[key] === "number" &&
        Number.isFinite(stats[key]) &&
        stats[key] >= 0
      );

    if (data.status !== "verified" ||
        !validPeriod ||
        !validStats) {
      period.textContent =
        "Market statistics awaiting verification";

      showNotice(
        "The latest Greater Victoria market " +
        "statistics are being prepared. " +
        "Please refer to the Victoria Real " +
        "Estate Board for the official report."
      );
      return;
    }

    period.textContent =
      data.reporting_month + " " +
      data.reporting_year +
      " | Latest Verified VREB Statistics";

    const grid = document.createElement("div");
    grid.className = "grid";

    labels.forEach(([key, label, prefix]) => {
      const card = document.createElement("div");
      card.className = "stat";

      card.appendChild(
        makeElement("div", "stat-label", label)
      );

      card.appendChild(
        makeElement(
          "div",
          "stat-value",
          formatNumber(stats[key], prefix)
        )
      );

      const changeKey = key + "_yoy_percent";
      const change = stats[changeKey];

      if (typeof change === "number" &&
          Number.isFinite(change)) {
        const sign = change > 0 ? "+" : "";

        card.appendChild(
          makeElement(
            "div",
            "stat-change",
            sign + change.toFixed(1) +
            "% year over year"
          )
        );
      }

      grid.appendChild(card);
    });

    document.getElementById("market-content")
      .replaceChildren(grid);

  } catch (error) {
    document.getElementById("reporting-period")
      .textContent = "Market data unavailable";

    showNotice(
      "Market statistics are temporarily " +
      "unavailable. Please check the official " +
      "VREB report using the link below."
    );
  }
}

loadMarketData();
</script>

</body>
</html>
